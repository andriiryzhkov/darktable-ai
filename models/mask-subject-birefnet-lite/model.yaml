id: mask-subject-birefnet-lite
name: "mask subject birefnet lite"
description: "BiRefNet Lite for automatic subject / foreground segmentation"
task: mask
version: "0.1"
arch: birefnet
backend: onnx
type: single
dep_group: birefnet

attributes:
  input_sizes: [1024]

model_card:
  long_description: "BiRefNet Lite (Swin Tiny backbone) for automatic subject extraction. Produces a foreground mask of the dominant subject in a single forward pass – no click prompts required. Complements the click-based SAM 2.1 and SegNext models for cases where the scene has one clear primary subject"
  scope: "automatic subject / foreground segmentation"
  author: "Peng Zheng et al."
  source: "https://github.com/ZhengPeng7/BiRefNet"
  paper: "https://arxiv.org/abs/2401.03407"
  license: "MIT"
  training_data: "DIS5K – 5470 high-resolution images collected from Flickr and manually annotated for dichotomous image segmentation"
  training_data_license: "DIS5K dataset under Apache 2.0; the Flickr-sourced images do not carry documented per-image creator consent"
  notes: "Lite variant uses swin_v1_t (Swin Tiny) backbone, smaller than the full BiRefNet's swin_v1_l. Trained primarily for dichotomous image segmentation and salient object detection; best on scenes with one clear subject"

checkpoints:
  # FP16 variant by default (~115 MiB). For FP32 (~224 MiB) change the URL
  # to `onnx/model.onnx` from the same HF path.
  - url: "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model_fp16.onnx"
    path: "output/mask-subject-birefnet-lite/model.onnx"
